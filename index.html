<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYE — Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .search-box button {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .search-box button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .weather-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        .city-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .city-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .city-details {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .weather-icon {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }

        .temp-section h2 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .weather-description {
            color: var(--text-muted);
            font-size: 1rem;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .forecast {
            margin-top: 30px;
        }

        .forecast-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .forecast-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .forecast-day {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .forecast-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .forecast-temp {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .skeleton {
            animation: skeleton-loading 1s infinite alternate;
        }

        @keyframes skeleton-loading {
            0% {
                background-color: rgba(255, 255, 255, 0.05);
            }
            100% {
                background-color: rgba(255, 255, 255, 0.1);
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .temp-section h2 {
                font-size: 2.5rem;
            }

            .weather-main {
                flex-direction: column;
                gap: 20px;
            }

            .weather-icon {
                font-size: 60px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .forecast-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SKYE</h1>
            <p>Tu app de clima minimalista</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Busca una ciudad..." />
            <button onclick="searchWeather()">Buscar</button>
        </div>

        <div id="errorContainer"></div>
        <div id="weatherContainer"></div>
    </div>

    <script>
        const API_KEY = '65ef8653688fa3a684e3a18f8b71f86b';
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        // Iconos para el clima
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '🌤️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            document.getElementById('weatherContainer').innerHTML = '';
        }

        function showLoading() {
            document.getElementById('weatherContainer').innerHTML = `
                <div class="weather-card">
                    <div class="city-info skeleton" style="height: 40px; border-radius: 8px; margin-bottom: 20px;"></div>
                    <div class="weather-main">
                        <div class="skeleton" style="width: 80px; height: 80px; border-radius: 50%;"></div>
                        <div style="flex: 1;">
                            <div class="skeleton" style="height: 60px; margin-bottom: 10px; border-radius: 8px;"></div>
                            <div class="skeleton" style="height: 20px; border-radius: 8px;"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function searchWeather() {
            const city = document.getElementById('searchInput').value.trim();
            if (!city) {
                showError('Por favor ingresa el nombre de una ciudad');
                return;
            }

            showLoading();
            document.getElementById('errorContainer').innerHTML = '';

            try {
                // Obtener coordenadas de la ciudad
                const geoResponse = await fetch(
                    `${BASE_URL}/weather?q=${city}&appid=${API_KEY}&units=metric&lang=es`
                );

                if (!geoResponse.ok) {
                    if (geoResponse.status === 404) {
                        showError('Ciudad no encontrada. Intenta con otro nombre.');
                    } else {
                        showError('Error al buscar la ciudad. Intenta de nuevo.');
                    }
                    return;
                }

                const weatherData = await geoResponse.json();
                const { coord, main, weather, wind, clouds, sys } = weatherData;

                // Obtener pronóstico de 5 días
                const forecastResponse = await fetch(
                    `${BASE_URL}/forecast?lat=${coord.lat}&lon=${coord.lon}&appid=${API_KEY}&units=metric&lang=es`
                );

                const forecastData = await forecastResponse.json();
                const forecast = forecastData.list.filter((_, i) => i % 8 === 0).slice(0, 5);

                renderWeather(weatherData, forecast);
            } catch (error) {
                console.error(error);
                showError('Error de conexión. Verifica tu conexión a internet.');
            }
        }

        function renderWeather(data, forecast) {
            const { main, weather, wind, clouds, sys, name, sys: { country } } = data;
            const icon = weatherIcons[weather[0].icon] || '🌤️';

            let html = `
                <div class="weather-card">
                    <div class="city-info">
                        <div class="city-name">${name}, ${country}</div>
                        <div class="city-details">${new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                    </div>

                    <div class="weather-main">
                        <div class="weather-icon">${icon}</div>
                        <div class="temp-section">
                            <h2>${Math.round(main.temp)}°C</h2>
                            <div class="weather-description">${weather[0].description}</div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Sensación Térmica</div>
                            <div class="detail-value">${Math.round(main.feels_like)}°C</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Humedad</div>
                            <div class="detail-value">${main.humidity}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Presión</div>
                            <div class="detail-value">${main.pressure} mb</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Viento</div>
                            <div class="detail-value">${Math.round(wind.speed)} m/s</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Nubosidad</div>
                            <div class="detail-value">${clouds.all}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Visibilidad</div>
                            <div class="detail-value">${(data.visibility / 1000).toFixed(1)} km</div>
                        </div>
                    </div>

                    <div class="forecast">
                        <div class="forecast-title">Pronóstico (5 días)</div>
                        <div class="forecast-grid">
                            ${forecast.map(day => {
                                const date = new Date(day.dt * 1000);
                                const dayName = date.toLocaleDateString('es-ES', { weekday: 'short' });
                                const icon = weatherIcons[day.weather[0].icon] || '🌤️';
                                return `
                                    <div class="forecast-item">
                                        <div class="forecast-day">${dayName}</div>
                                        <div class="forecast-icon">${icon}</div>
                                        <div class="forecast-temp">${Math.round(day.main.temp)}°C</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('weatherContainer').innerHTML = html;
        }

        // Buscar al presionar Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchWeather();
        });

        // Cargar clima de la ciudad actual al abrir
        window.addEventListener('load', () => {
            document.getElementById('searchInput').value = 'Buenos Aires';
            searchWeather();
        });
    </script>
</body>
</html>
